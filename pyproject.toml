[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryengine-localization"
version = "0.7.1"
description = "Safe, source-preserving localization tools for CryEngine projects"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "CryEngine Localization Contributors" }]
dependencies = []

[project.urls]
Repository = "https://github.com/Brilliant-Captain/CryEngineLocalizationTool"
Issues = "https://github.com/Brilliant-Captain/CryEngineLocalizationTool/issues"
Releases = "https://github.com/Brilliant-Captain/CryEngineLocalizationTool/releases"

[project.optional-dependencies]
test = ["pytest>=7.4"]
textures = ["Pillow>=10"]
fonts = ["fonttools>=4.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
cry-localize = "cryengine_localization.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cryengine_localization = ["locales/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
