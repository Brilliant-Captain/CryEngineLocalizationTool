name: Build Windows GUI and CLI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create project virtual environment
        shell: powershell
        run: python -m venv .venv
      - name: Install package and build tools
        shell: powershell
        run: .\.venv\Scripts\python.exe -m pip install -e ".[fonts,textures,build]"
      - name: Build GUI and CLI executables
        shell: powershell
        run: .\scripts\build_exe.ps1 -OutputDir .\release
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryEngineLocalization-windows
          path: release/
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: CryEngineLocalization-windows
          path: release/
      - name: Attach executable to GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $files = @(Get-ChildItem -LiteralPath .\release -File | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) { throw "No release files were produced" }
          & gh release create "${{ github.ref_name }}" @files --generate-notes
